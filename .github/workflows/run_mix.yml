name: Daily YouTube Music Mix

on:
  schedule:
    # Runs at 23:50 UTC every day
    - cron: '50 23 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel profile to run'
        required: true
        default: 'primary'
        type: choice
        options:
          - primary
          - gaming
      dry_run:
        description: 'Dry run (skip upload)'
        required: true
        default: false
        type: boolean

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync

      - name: Inject & Verify Secrets
        env:
          PRIMARY_TOKEN_JSON: ${{ secrets.PRIMARY_TOKEN_JSON }}
          GAMING_TOKEN_JSON: ${{ secrets.GAMING_TOKEN_JSON }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          COOKIES_TXT: ${{ secrets.COOKIES_TXT }}
        run: |
          mkdir -p config/tokens
          # Inject using environment variables to preserve newlines/special characters
          echo "$PRIMARY_TOKEN_JSON" > config/tokens/primary_token.json
          echo "$GAMING_TOKEN_JSON" > config/tokens/gaming_token.json
          echo "$CLIENT_SECRETS_JSON" > config/client_secrets.json
          echo "$COOKIES_TXT" > config/cookies.txt
          
          # Inject .env for Spotify
          echo "SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}" > .env
          echo "SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}" >> .env
          
          # Verify sizes and content glimpses
          echo "Checking secret files..."
          ls -l config/tokens/primary_token.json
          ls -l config/client_secrets.json
          ls -l config/cookies.txt
          ls -l .env
          
          echo "Verifying cookie file header..."
          head -n 1 config/cookies.txt

      - name: Run Automation Workflow
        run: |
          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            DRY_ARG="--dry"
          fi
          uv run main.py run --channel ${{ github.event.inputs.channel || 'primary' }} $DRY_ARG
        env:
          PYTHONUNBUFFERED: 1
