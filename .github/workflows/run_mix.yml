name: Daily YouTube Music Mix

on:
  schedule:
    # Runs at 23:50 UTC every day
    - cron: '50 23 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel profile to run'
        required: true
        default: 'primary'
        type: choice
        options:
          - primary
          - gaming
      dry_run:
        description: 'Dry run (skip upload)'
        required: true
        default: false
        type: boolean

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync

      - name: Inject & Verify Secrets
        run: |
          mkdir -p config/tokens
          # Inject
          echo "${{ secrets.PRIMARY_TOKEN_JSON }}" > config/tokens/primary_token.json
          echo "${{ secrets.GAMING_TOKEN_JSON }}" > config/tokens/gaming_token.json
          echo "${{ secrets.CLIENT_SECRETS_JSON }}" > config/client_secrets.json
          echo "SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}" > .env
          echo "SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}" >> .env
          
          # Verify sizes (if size is 1 byte, it likely only contains a newline/empty)
          echo "Checking secret files..."
          ls -l config/tokens/primary_token.json
          ls -l config/client_secrets.json
          ls -l .env

      - name: Run Automation Workflow
        run: |
          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            DRY_ARG="--dry"
          fi
          uv run main.py run --channel ${{ github.event.inputs.channel || 'primary' }} $DRY_ARG
        env:
          PYTHONUNBUFFERED: 1
